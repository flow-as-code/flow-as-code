<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flow Studio</title>
    <!--
      A description and nothing more. This shell may carry no href, no src, and
      no absolute URL of any kind (packages/studio/tests/demo-bundle.test.ts):
      no canonical, no Open Graph, no favicon, no analytics. A description tag
      carries none of those and is worth having, because /studio/ is a page
      people land on directly. vite.config.ts swaps it for the demo's own
      wording in `--mode demo`, the same way it swaps the title.
    -->
    <meta
      name="description"
      content="Visual editor for Amazon Connect contact flows: a canvas over the FlowDoc interchange format, with typed reference pickers, inline lint, and CDK and Terraform export."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
